{{- range $name, $svc := .Values.services }}
{{- if not $svc.noService }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: {{ $svc.type | default "ClusterIP" }}
  selector:
    app: {{ $name }}
  ports:
    - port: {{ $svc.port }}
      protocol: TCP
      targetPort: http
{{- end }}
{{- end }}
