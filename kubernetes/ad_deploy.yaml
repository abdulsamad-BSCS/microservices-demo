apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ad
  name: adservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ad
  template:
    metadata:
      labels:
        app: ad
    spec:
      containers:
        - image: 093747270488.dkr.ecr.eu-west-2.amazonaws.com/adservice
          name: adservice
          ports:
            - name: ad-port
              containerPort: 9555
          resources:
            requests:
              cpu: "100m"
              memory: "180Mi"
            limits:
              cpu: "300m"
              memory: "300Mi"
