apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: payment
  name: paymentservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - image: 093747270488.dkr.ecr.eu-west-2.amazonaws.com/paymentservice
          name: paymentservice
          ports:
            - name: payment-port
              containerPort: 50051
          env:
            - name: PORT
              value: "50051"
            - name: DISABLE_PROFILER
              value: "1"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
