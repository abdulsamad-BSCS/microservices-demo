apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: product
  name: productcatalogservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      containers:
        - image: 093747270488.dkr.ecr.eu-west-2.amazonaws.com/productcatalogservice
          name: productcatalogservice
          ports:
            - name: product-port
              containerPort: 3550
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
