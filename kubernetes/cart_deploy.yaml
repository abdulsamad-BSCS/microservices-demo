apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cart
  name: cartservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec:
      containers:
        - image: 093747270488.dkr.ecr.eu-west-2.amazonaws.com/cartservice
          name: cartservice
          ports:
            - name: cart-port
              containerPort: 7070
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
