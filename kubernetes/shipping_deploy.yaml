apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: shipping
  name: shippingservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shipping
  template:
    metadata:
      labels:
        app: shipping
    spec:
      containers:
        - image: 093747270488.dkr.ecr.eu-west-2.amazonaws.com/shippingservice
          name: shippingservice
          ports:
            - name: shipping-port
              containerPort: 50051
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
